<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warranty Vault</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 10px);
      --green: var(--hub-tint-success-fg, #047857); --green-soft: var(--hub-tint-success, #d1fae5);
      --amber: var(--hub-tint-warning-fg, #b45309); --amber-soft: var(--hub-tint-warning, #fef3c7);
      --red: var(--hub-tint-danger-fg, #b91c1c); --red-soft: var(--hub-tint-danger, #fee2e2);
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 8px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid transparent; border-radius: 8px; padding: 8px 12px;
      font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer;
      min-height: 38px; background: var(--accent); color: var(--accent-fg);
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: rgba(127,127,127,.08); }
    .btn-danger { background: var(--red-soft); color: var(--red); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .search { margin-bottom: 10px; }
    .row {
      display: flex; align-items: center; gap: 11px; padding: 10px 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .row-icon { font-size: 1.15rem; width: 30px; text-align: center; flex-shrink: 0; }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-weight: 750; font-size: .92rem; }
    .row-meta { color: var(--muted); font-size: .78rem; }
    .row-side { flex-shrink: 0; text-align: right; display: grid; gap: 3px; justify-items: end; }
    .pill {
      display: inline-flex; align-items: center; min-height: 20px; padding: 1px 8px;
      border-radius: 999px; white-space: nowrap; background: var(--bg); color: var(--muted);
      font-size: .72rem; font-weight: 800;
    }
    .pill.expiring { background: var(--amber-soft); color: var(--amber); }
    .pill.active { background: var(--green-soft); color: var(--green); }
    .pill.expired { background: var(--red-soft); color: var(--red); }
    .edit-link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .76rem; font-weight: 700; padding: 2px 4px; }
    .edit-link:hover { color: var(--text); text-decoration: underline; }
    .receipt-link { color: var(--muted); font-size: .76rem; font-weight: 700; text-decoration: underline; }
    .empty { color: var(--muted); text-align: center; padding: 30px 16px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 92vh; overflow-y: auto; }
    .modal h2 { font-size: 1.05rem; margin-bottom: 16px; }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 5px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    input, select, textarea {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 56px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
    .modal-left { margin-right: auto; }
    @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
  </style>
  <base href="/run/warranty-vault/">
</head>
<body>
<div class="app">
  <div id="root" class="empty">Loading…</div>
</div>

<script type="module">
import { esc, isAdult, hubConfirm, fmtMoney, createFilesHelper, searchMatch, hubToday, glyph } from "/hub-sdk.js";

// The household's calendar day as a Date, for the pure helpers in logic.js.
// Those helpers default their date parameter to `new Date()` — the VIEWER
// DEVICE's calendar — but they compare it against dates STORED on the household
// calendar, which is what every server-side surface (glance, kiosk, cron,
// `:today` in declared SQL) reports. Near midnight, or for a member in another
// timezone, the two name different days. logic.js stays pure and SDK-free, so
// the household day is supplied here. Noon keeps a DST shift from tipping it
// into an adjacent day.
const hubDay = () => new Date(`${hubToday()}T12:00:00`);

import {
  CATEGORIES, categoryMeta, warrantyExpiryDate, warrantyLabel,
  sortedItems, parseMoneyToCents, searchableFields,
  wantsExpiryEntry, saveEventPlan, expiryCancelledPayload,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const DOCS = window.__DOCS_URL ?? "";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;

const EVENTS = window.__EVENTS_URL ?? "";

async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // Best-effort: the row is already written, so a failed publish is not fatal.
  }
}

/**
 * Publish whatever this save calls for. The decision lives in logic.js
 * (`saveEventPlan`) so it can be tested without a DOM; this is the loop.
 *
 * Two lanes. `warranty.item_added` is the app's standing "an item was added"
 * contract and fires on EVERY insert — an item with no warranty months still
 * announces itself, because narrowing that event to items with cover would
 * silently drop them out of every rule already keyed on it.
 * `warranty.expiry_scheduled` is the calendar lane and only goes out for a
 * real `yyyy-mm-dd`, because an empty string is a MISSING required param to
 * the automation runner, not an absent optional, and would fail the run.
 *
 * Both carry the same `source_ref_id`, and the calendar's `create_event`
 * conflicts on it, so re-announcing MOVES the entry already there instead of
 * adding one beside it. Lengthening a warranty or fixing an item's name
 * therefore leaves exactly one entry, on the right day.
 *
 * publishEvent swallows its own failures, so nothing here can roll back the
 * row that is already written.
 */
async function publishSaveEvents(prev, next) {
  for (const { type, payload } of saveEventPlan(prev, next)) {
    await publishEvent(type, next.id, payload);
  }
}

/**
 * Say that an announced expiry no longer applies, so a rule can take the entry
 * back down.
 *
 * Deliberately NOT symmetric with announcing. Announcing is an upsert, so it
 * is free to repeat; a retraction only goes out on a real transition out of
 * wanting an entry (a deletion, or an edit that clears the expiry), because
 * one published on every save would burn an automation run per typo fix to
 * update zero rows.
 */
async function retractExpiry(item, reason) {
  await publishEvent("warranty.expiry_cancelled", item.id, expiryCancelledPayload(item, reason));
}

const files = createFilesHelper(window.__FILES_URL ?? "");

let members = [];
let me = null;
let items = [];
let query = "";
let error = "";
let modalEl = null;

function nowIso() { return new Date().toISOString(); }
function canManage() { return !!me && isAdult(me); }

/* ── DB helper ─────────────────────────────────────────────────────────────── */
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Couldn’t reach the hub. Try again.");
  return json;
}

/* ── Loading ───────────────────────────────────────────────────────────────── */
async function loadMembers() {
  if (!CONTEXT) {
    members = [{ id: "demo-1", name: "Alex", role: "adult" }];
  } else {
    // A roster that cannot be read is a failed load, not an empty household.
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const json = await res.json().catch(() => null);
    if (!res.ok || !json || typeof json !== "object") throw new Error("Couldn’t reach the hub. Try again.");
    // A 200 that names the roster in `$errors` is the hub failing to read it.
    if (Array.isArray(json.$errors) && json.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
    members = json["family.members"] ?? [];
  }
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

async function loadItems() {
  if (!DB) {
    items = [
      { id: "d1", name: "LG Dishwasher", category: "appliances", purchase_date: "2025-11-02", price_cents: 74900, retailer: "Home Depot", warranty_months: 12, warranty_expires_date: "2026-11-02", serial_number: "LG-8842-A", notes: "", receipt_file_id: "", receipt_doc_id: "", created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
      { id: "d2", name: "MacBook Air", category: "electronics", purchase_date: "2024-09-15", price_cents: 119900, retailer: "Apple", warranty_months: 24, warranty_expires_date: "2026-09-15", serial_number: "C02XL0", notes: "AppleCare", receipt_file_id: "", receipt_doc_id: "", created_by: "demo-1", created_at: nowIso(), updated_at: nowIso() },
    ];
    return;
  }
  const res = await db("SELECT id, name, category, purchase_date, price_cents, retailer, warranty_months, warranty_expires_date, serial_number, notes, receipt_file_id, receipt_doc_id, created_by, created_at, updated_at FROM app_warranty_vault__items");
  items = res.rows ?? [];
}

// True from a failed first load until a load succeeds. While it is, the page
// shows the banner in place of the vault and offers no "+ Add item".
let loadFailed = false;
async function refresh() {
  error = "";
  try {
    await Promise.all([loadMembers(), loadItems()]);
    loadFailed = false;
    render();
  } catch { loadFailed = true; render(); }
}

// An open dialog covers the page banner, so the message goes inside the dialog.
function showModalError(m) {
  const box = modalEl?.querySelector(".modal");
  if (!box) return false;
  let el = box.querySelector(".error");
  if (!el) { el = document.createElement("div"); el.className = "error"; el.setAttribute("role", "alert"); box.prepend(el); }
  el.textContent = m;
  return true;
}
function showError(msg) { if (showModalError(msg)) return; error = msg; render(); }
// A failed write is said in this app's words; the error itself goes to the console.
function writeFailed(e, line) { console.error("[warranty-vault]", e); showError(line); }

/* ── Mutations ─────────────────────────────────────────────────────────────── */
/**
 * Answers true once the hub has stored the item, false when the write failed.
 * The list changes and the form (`dlg`, the dialog it was sent from) closes
 * only after the write is stored: a failed save leaves the form open as typed.
 */
async function saveItem(fields, existingId, dlg) {
  const now = nowIso();
  if (existingId) {
    let res;
    try {
      res = await db(
        "UPDATE app_warranty_vault__items SET name=?, category=?, purchase_date=?, price_cents=?, retailer=?, warranty_months=?, warranty_expires_date=?, serial_number=?, notes=?, receipt_file_id=?, receipt_doc_id=?, updated_at=? WHERE id=?",
        [fields.name, fields.category, fields.purchase_date, fields.price_cents, fields.retailer, fields.warranty_months, fields.warranty_expires_date, fields.serial_number, fields.notes, fields.receipt_file_id, fields.receipt_doc_id, now, existingId],
      );
    } catch (e) { writeFailed(e, "Couldn’t save the item — try again."); return false; }
    // The hub answers 200 with `changed: 0` when no row took the edit (the
    // item was deleted meanwhile, or the write was refused). Nothing is
    // stored, so the list is read again and the form stays open as typed.
    if (res.changed === 0) {
      await refresh();
      const gone = !loadFailed && !items.some((i) => i.id === existingId);
      showError(gone ? "This item is no longer in the vault." : "Couldn’t save the item — try again.");
      return false;
    }
    // Looked up after the write: the list may have been reloaded meanwhile.
    const idx = items.findIndex((i) => i.id === existingId);
    const prev = idx !== -1 ? items[idx] : null;
    if (idx !== -1) items[idx] = { ...items[idx], ...fields, updated_at: now };
    if (modalEl === dlg) closeModal();
    // The item is stored: a throw while redrawing must not report it as failed.
    try { render(); } catch (e) { console.error("[warranty-vault]", e); }
    // Only after the UPDATE committed, and only when the edit touched
    // something the calendar entry is built from — a note-only edit would
    // otherwise spend an automation run rewriting an entry that is already
    // correct. publishEvent swallows its own failures, so this can never
    // roll the saved row back.
    // Only after the UPDATE committed. saveEventPlan returns nothing for an
    // edit that cannot move the calendar entry — a note-only save must not
    // spend an automation run rewriting an entry that is already correct.
    // An item no longer in the list has nothing to announce: with no `prev`
    // it would read as an insert.
    if (idx === -1) return true;
    await publishSaveEvents(prev, items[idx]);
    return true;
  } else {
    const row = { id: crypto.randomUUID(), ...fields, created_by: me.id, created_at: now, updated_at: now };
    try {
      await db(
        "INSERT INTO app_warranty_vault__items (id, name, category, purchase_date, price_cents, retailer, warranty_months, warranty_expires_date, serial_number, notes, receipt_file_id, receipt_doc_id, created_by, created_at, updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",
        [row.id, row.name, row.category, row.purchase_date, row.price_cents, row.retailer, row.warranty_months, row.warranty_expires_date, row.serial_number, row.notes, row.receipt_file_id, row.receipt_doc_id, row.created_by, now, now],
      );
    } catch (e) { writeFailed(e, "Couldn’t add the item — try again."); return false; }
    items = [...items, row];
    if (modalEl === dlg) closeModal();
    // The item is stored: a throw while redrawing must not report it as failed.
    try { render(); } catch (e) { console.error("[warranty-vault]", e); }
    await publishSaveEvents(null, row);
    return true;
  }
}

async function deleteItem(id) {
  const item = items.find((i) => i.id === id);
  const ok = await hubConfirm({ message: "Delete this item?", description: "Its receipt document is removed too.", confirmLabel: "Delete", destructive: true });
  if (!ok) return;
  const prev = items;
  items = items.filter((i) => i.id !== id);
  closeModal(); render();
  try {
    // The receipt bytes go with the row: `manifest.delete_file_columns` has the
    // hub read `receipt_file_id` off the doomed row and queue the R2 reclaim
    // inside this DELETE's own transaction. That replaces the file-first
    // ordering this used to need — the row was the only record of the file id,
    // and the storage reconciler only reaps objects with NO metadata row, so
    // deleting the row first and dying before the file call leaked the bytes
    // permanently. Neither order can lose them now.
    // The hub document is still its own lane, and goes only once the row is
    // gone: deleting it takes the receipt file with it, so going first left an
    // item whose DELETE then failed or was refused naming a destroyed receipt.
    const res = await db("DELETE FROM app_warranty_vault__items WHERE id = ?", [id]);
    // The hub answers 200 with `changed: 0` when it removed no row. The list
    // is read again: an item still in it was not deleted, and is said so. One
    // that is gone may be an earlier try of this delete whose answer was
    // lost, so its entry is still retracted below.
    if (res.changed === 0) {
      await refresh();
      if (loadFailed) return;
      if (items.some((i) => i.id === id)) { showError("Couldn’t delete the item — try again."); return; }
    }
    // Best-effort: the hub has already queued the file's reclaim with the row,
    // so a failure here leaves at most a document record with no file.
    if (item?.receipt_doc_id && DOCS) await fetch(`${DOCS}/${encodeURIComponent(item.receipt_doc_id)}`, { method: "DELETE" }).catch(() => {});
    // The row is gone, so the day it named means nothing — take the calendar
    // entry down with it. Only if it ever announced one: an item with no
    // warranty never put anything there to retract.
    if (item && wantsExpiryEntry(item)) await retractExpiry(item, "deleted");
  } catch (e) { items = prev; writeFailed(e, "Couldn’t delete the item — try again."); }
}

/** Upload a receipt file and create the hub document record. */
async function uploadReceipt(file, itemName) {
  const { id: fileId } = await files.upload(file);
  let docId = "";
  if (DOCS) {
    try {
      const res = await fetch(DOCS, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: `Receipt — ${itemName || file.name}`,
          category: "home",
          fileKey: fileId,
          mimeType: file.type,
          sizeBytes: file.size,
          folder: "Warranties",
          sharedWith: ["everyone"],
        }),
      });
      if (res.ok) docId = (await res.json())?.id ?? "";
    } catch { /* document record is best-effort; the file id still links */ }
  }
  return { fileId, docId };
}

/* ── Rendering ─────────────────────────────────────────────────────────────── */
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(`${iso}T12:00:00`);
  if (Number.isNaN(d.getTime())) return iso;
  return new Intl.DateTimeFormat(undefined, { month: "short", year: "numeric" }).format(d);
}

function renderItem(i) {
  const cat = categoryMeta(i.category);
  const status = i._status;
  const metaBits = [
    i.retailer ? esc(i.retailer) : "",
    i.purchase_date ? `bought ${esc(fmtDate(i.purchase_date))}` : "",
    i.price_cents != null ? esc(fmtMoney(Number(i.price_cents))) : "",
    i.serial_number ? `SN ${esc(i.serial_number)}` : "",
  ].filter(Boolean).join(" · ");
  return `
    <div class="row">
      <div class="row-icon" aria-hidden="true">${glyph(cat.glyph)}</div>
      <div class="row-body">
        <div class="row-title">${esc(i.name)}</div>
        <div class="row-meta">${metaBits}</div>
        ${i.notes ? `<div class="row-meta">${esc(i.notes)}</div>` : ""}
      </div>
      <div class="row-side">
        <span class="pill ${esc(status)}">${esc(warrantyLabel(i, hubDay()))}</span>
        <span>
          ${i.receipt_file_id ? `<a class="receipt-link" href="${esc(files.url(i.receipt_file_id))}" target="_blank" rel="noopener">Receipt</a>` : ""}
          ${canManage() ? `<button class="edit-link" data-edit="${esc(i.id)}">Edit</button>` : ""}
        </span>
      </div>
    </div>`;
}

function render() {
  const root = document.getElementById("root");
  root.className = "app-root";
  if (loadFailed) {
    root.innerHTML = `
    <div class="topbar">
      <div>
        <h1>${glyph("receipt")} Warranty Vault</h1>
        <p class="muted tiny">What you bought, when, and how long it's covered.</p>
      </div>
    </div>
    <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the vault.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }
  const q = query.trim();
  const list = sortedItems(items, hubDay()).filter((i) =>
    !q || searchMatch(q, searchableFields(i)));
  root.innerHTML = `
    <div class="topbar">
      <div>
        <h1>${glyph("receipt")} Warranty Vault</h1>
        <p class="muted tiny">What you bought, when, and how long it's covered.</p>
      </div>
      ${canManage() ? `<button class="btn" data-add>+ Add item</button>` : ""}
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${items.length > 5 ? `<div class="search"><input id="search" placeholder="Search items or retailers…" value="${esc(query)}" /></div>` : ""}
    ${list.length
      ? `<div class="stack">${list.map(renderItem).join("")}</div>`
      : `<div class="card empty">${items.length ? "No matches." : `Nothing in the vault yet${canManage() ? " — add your first purchase" : ""}.`}</div>`}
    ${!canManage() && items.length ? `<p class="muted tiny" style="margin-top:10px">Only adults can edit the vault.</p>` : ""}
  `;
  const search = document.getElementById("search");
  if (search) {
    search.addEventListener("input", (e) => {
      query = e.target.value;
      render();
      const el = document.getElementById("search");
      el?.focus();
      el?.setSelectionRange(el.value.length, el.value.length);
    });
  }
}

/* ── Modal ─────────────────────────────────────────────────────────────────── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  // A form whose item write is out stays put until the hub has answered.
  modalEl.addEventListener("click", (e) => { if (e.target === modalEl && !modalEl.dataset.writing) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function openEditor(existing) {
  const i = existing ?? null;
  const catOptions = CATEGORIES.map((c) => `<option value="${c.value}" ${i?.category === c.value ? "selected" : ""}>${c.label}</option>`).join("");
  const canUpload = !!window.__FILES_URL;
  openModal(`
    <h2>${i ? "Edit item" : "Add item"}</h2>
    <form class="form" id="item-form">
      <div class="field"><label for="f-name">Item</label><input id="f-name" data-autofocus value="${esc(i?.name ?? "")}" placeholder="LG Dishwasher" required /></div>
      <div class="grid2">
        <div class="field"><label for="f-cat">Category</label><select id="f-cat">${catOptions}</select></div>
        <div class="field"><label for="f-retailer">Retailer</label><input id="f-retailer" value="${esc(i?.retailer ?? "")}" placeholder="Home Depot" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="f-date">Purchase date</label><input id="f-date" type="date" value="${esc(i?.purchase_date ?? "")}" /></div>
        <div class="field"><label for="f-price">Price</label><input id="f-price" inputmode="decimal" value="${i?.price_cents != null ? esc((Number(i.price_cents) / 100).toFixed(2)) : ""}" placeholder="749.00" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="f-warranty">Warranty (months)</label><input id="f-warranty" type="number" min="0" max="600" value="${esc(i?.warranty_months ?? "")}" placeholder="12" /></div>
        <div class="field"><label for="f-serial">Serial number</label><input id="f-serial" value="${esc(i?.serial_number ?? "")}" /></div>
      </div>
      ${canUpload ? `
        <div class="field">
          <label for="f-receipt">Receipt ${i?.receipt_file_id ? `<span class="muted" style="text-transform:none">(replaces the current one)</span>` : ""}</label>
          <input id="f-receipt" type="file" accept="image/*,application/pdf" />
        </div>` : ""}
      <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes">${esc(i?.notes ?? "")}</textarea></div>
      <div class="modal-actions">
        ${i ? `<button type="button" class="btn btn-danger modal-left" data-delete="${esc(i.id)}">Delete</button>` : ""}
        <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn">${i ? "Save" : "Add"}</button>
      </div>
    </form>`);
  modalEl.querySelector("[data-autofocus]")?.focus();
  const dlg = modalEl;
  // The receipt this form already sent, kept so that pressing save again after
  // a failed save names the same file instead of storing a second copy.
  let uploaded = null;
  modalEl.querySelector("#item-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (dlg.dataset.busy) return;
    const name = document.getElementById("f-name").value.trim();
    if (!name) { document.getElementById("f-name").focus(); return; }
    const priceRaw = document.getElementById("f-price").value.trim();
    const price = parseMoneyToCents(priceRaw);
    if (priceRaw && price == null) { showError("Price must be a dollar amount like 749 or 749.99."); return; }
    const purchaseDate = document.getElementById("f-date").value;
    const warrantyRaw = document.getElementById("f-warranty").value;
    const warrantyMonths = warrantyRaw ? Number(warrantyRaw) : null;
    const btn = dlg.querySelector('button[type="submit"]');
    // While a save is out the form cannot be sent twice or deleted. Cancel
    // still works through the receipt upload, which can be slow and is undone
    // below; once the item itself is being written (`writing`) the form waits
    // for the answer, so what the list shows and what is stored cannot part.
    const setBusy = (on, writing = false) => {
      dlg.dataset.busy = on ? "1" : "";
      dlg.dataset.writing = writing ? "1" : "";
      dlg.querySelectorAll('button[type="submit"], [data-delete]').forEach((b) => { b.disabled = on; });
      dlg.querySelectorAll("[data-cancel]").forEach((b) => { b.disabled = writing; });
      if (btn) btn.textContent = on ? "Saving…" : (i ? "Save" : "Add");
      if (!on) btn?.focus();
    };
    setBusy(true);
    dlg.querySelector(".error")?.remove();
    // Every field is read before the first wait, so the row is the form as it
    // stood when save was pressed.
    const fields = {
      name,
      category: document.getElementById("f-cat").value,
      purchase_date: purchaseDate,
      price_cents: price,
      retailer: document.getElementById("f-retailer").value.trim(),
      warranty_months: Number.isFinite(warrantyMonths) && warrantyMonths > 0 ? warrantyMonths : null,
      warranty_expires_date: warrantyExpiryDate(purchaseDate, warrantyMonths),
      serial_number: document.getElementById("f-serial").value.trim(),
      notes: document.getElementById("f-notes").value.trim(),
      receipt_file_id: i?.receipt_file_id ?? "",
      receipt_doc_id: i?.receipt_doc_id ?? "",
    };
    const fileInput = document.getElementById("f-receipt");
    const file = fileInput?.files?.[0];
    let replaced = null;
    try {
      if (file) {
        const same = uploaded && uploaded.file.name === file.name && uploaded.file.size === file.size && uploaded.file.lastModified === file.lastModified;
        if (!same) {
          const up = await uploadReceipt(file, name);
          // Cancelled while the receipt was on its way: nothing is saved, and
          // the copy just stored, which no item names, goes again. Best-effort.
          if (modalEl !== dlg) {
            if (up.docId && DOCS) fetch(`${DOCS}/${encodeURIComponent(up.docId)}`, { method: "DELETE" }).catch(() => {});
            files.delete(up.fileId).catch(() => {});
            return;
          }
          uploaded = { file, ...up };
        }
        replaced = { fileId: fields.receipt_file_id, docId: fields.receipt_doc_id };
        fields.receipt_file_id = uploaded.fileId;
        fields.receipt_doc_id = uploaded.docId;
      }
    } catch (err) {
      // Cancelled meanwhile: there is no form left to say it on.
      if (modalEl !== dlg) { console.error("[warranty-vault]", err); return; }
      setBusy(false);
      // A file the hub would not take (too large, a type it does not store, no
      // storage left) is said in the hub's words; any other failure is not.
      const refused = err?.status === 507 || (err?.status >= 400 && err?.status < 500);
      if (refused && err.message) showError(`Receipt upload failed: ${err.message}`);
      else writeFailed(err, "Couldn’t upload the receipt — try again.");
      return;
    }

    setBusy(true, true);
    const saved = await saveItem(fields, i?.id ?? null, dlg).catch((err) => { writeFailed(err, "Couldn’t save the item — try again."); return false; });
    // A failed save leaves the form as typed, ready to be sent again.
    if (!saved) setBusy(false);
    // The edited item is gone (the list was just read again without it), so no
    // row names the receipt this form sent. Its document goes first and the
    // file only once no document names it; sending again uploads afresh.
    if (!saved && uploaded && i && !loadFailed && !items.some((x) => x.id === i.id)) {
      const { fileId, docId } = uploaded;
      uploaded = null;
      Promise.resolve(docId && DOCS ? fetch(`${DOCS}/${encodeURIComponent(docId)}`, { method: "DELETE" }) : null)
        .then((r) => { if (!r || r.ok || r.status === 404) return files.delete(fileId); })
        .catch(() => {});
    }
    // The replaced receipt goes only once the item names the new one: after a
    // failed save the item still points at it. Best-effort; a failure here
    // leaves the save standing.
    if (saved && replaced) {
      if (replaced.docId && DOCS) fetch(`${DOCS}/${encodeURIComponent(replaced.docId)}`, { method: "DELETE" }).catch(() => {});
      if (replaced.fileId) files.delete(replaced.fileId).catch(() => {});
    }
  });
}

/* ── Events ────────────────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.matches('[data-testid="load-retry"]')) { refresh(); return; }
  if (t.hasAttribute("data-add")) { openEditor(null); return; }
  if (t.hasAttribute("data-edit")) { openEditor(items.find((i) => i.id === t.getAttribute("data-edit"))); return; }
  if (t.hasAttribute("data-cancel")) { closeModal(); return; }
  if (t.hasAttribute("data-delete")) { deleteItem(t.getAttribute("data-delete")); return; }
});

refresh();
</script>
</body>
</html>
